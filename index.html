<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Treino Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f172a"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100dvh}
#root{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:800;text-align:center;background:linear-gradient(135deg,#7c3aed,#a78bfa,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-box{max-width:380px;margin:80px auto;background:rgba(255,255,255,0.03);border-radius:20px;padding:40px 24px;border:1px solid rgba(255,255,255,0.06);text-align:center}
.auth-box p{font-size:14px;color:#94a3b8;margin:8px 0 32px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:15px;font-weight:600;cursor:pointer}
.btn-google svg{width:20px;height:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.topbar-user{font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.btn-sm{padding:6px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:rgba(255,255,255,0.05);color:#94a3b8}
.year-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0}
.year-nav button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.year-nav button:disabled{opacity:.2;cursor:not-allowed}
.year-label{font-size:28px;font-weight:800;background:linear-gradient(135deg,#7c3aed,#a78bfa,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;min-width:80px;text-align:center}
.year-current{font-size:11px;color:#64748b;text-align:center;margin-top:2px;cursor:pointer}
.goal-wrap{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.goal-wrap input{width:56px;padding:4px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:15px;text-align:center;font-weight:700;outline:none}
.goal-wrap span{font-size:13px;color:#64748b}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.card{background:rgba(255,255,255,0.03);border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,0.06);text-align:center}
.card-label{font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card-value{font-size:26px;font-weight:800;margin:4px 0 2px}
.card-sub{font-size:11px;color:#64748b}
.pbox{background:rgba(255,255,255,0.03);border-radius:14px;padding:16px;margin-bottom:18px;border:1px solid rgba(255,255,255,0.06)}
.prow{display:flex;justify-content:space-between;font-size:13px;color:#94a3b8;margin-bottom:4px}
.prow span:last-child{font-weight:700;color:#e2e8f0}
.bbg{height:10px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden;margin-bottom:10px}
.bfill{height:100%;border-radius:99px;transition:width .4s ease}
.nav{display:flex;gap:6px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.nav button{padding:8px 14px;border-radius:99px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s}
.nav .on{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
.nav .off{background:rgba(255,255,255,0.05);color:#94a3b8}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mbox{background:rgba(255,255,255,0.03);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,0.06)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mname{font-weight:700;font-size:15px}
.mbadge{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.dwh{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.dwh span{text-align:center;font-size:10px;color:#64748b;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.dnum{width:30px;height:30px;border-radius:50%;border:1px solid transparent;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dnum.empty{pointer-events:none}
.dnum.notr{background:rgba(255,255,255,0.05);color:#94a3b8}
.dnum.tr{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-weight:700}
.dnum.today{border:2px solid #a78bfa}
.dots{display:flex;gap:2px;height:6px;align-items:center;justify-content:center}
.dot{width:5px;height:5px;border-radius:50%}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:#1e293b;border-radius:20px;padding:24px;max-width:380px;width:100%;border:1px solid rgba(255,255,255,0.1);max-height:85vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:700;margin-bottom:4px}
.modal-date{font-size:13px;color:#64748b;margin-bottom:16px}
.modal-cat{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.modal-types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:2px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);cursor:pointer;transition:all .15s;font-size:13px;color:#94a3b8}
.type-btn.sel{border-color:var(--tc);background:rgba(255,255,255,0.05);color:#e2e8f0;font-weight:600}
.type-icon{font-size:18px}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
.btn-cancel{background:rgba(255,255,255,0.05);color:#94a3b8}
.btn-danger{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.2)}
.slist{display:grid;gap:8px}
.sr{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 16px;border:1px solid rgba(255,255,255,0.06)}
.sr.cur{border-color:rgba(167,139,250,0.3)}
.sn{width:75px;font-size:13px;font-weight:600}
.sbbg{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden}
.sbf{height:100%;border-radius:99px;transition:width .3s}
.sp{font-size:13px;font-weight:700;width:42px;text-align:right}
.sc{font-size:12px;color:#64748b;width:48px;text-align:right}
.type-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.ts-card{background:rgba(255,255,255,0.03);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px}
.ts-icon{font-size:24px}.ts-info{flex:1}.ts-name{font-size:12px;color:#94a3b8}.ts-val{font-size:20px;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#94a3b8}
.legend-dot{width:8px;height:8px;border-radius:50%}
.footer{text-align:center;font-size:11px;color:#475569;margin-top:24px}
.g{color:#4ade80}.y{color:#facc15}.r{color:#f87171}
.ld{text-align:center;color:#64748b;padding:60px 20px;font-size:14px}

/* Perf */
.perf-streak-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.perf-streak-card{background:rgba(255,255,255,0.03);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.06);text-align:center}
.perf-streak-icon{font-size:28px;margin-bottom:4px}
.perf-streak-val{font-size:30px;font-weight:800}
.perf-streak-label{font-size:11px;color:#64748b;margin-top:2px}
.perf-section{margin-bottom:20px}
.perf-section-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.perf-weekly{background:rgba(255,255,255,0.03);border-radius:14px;padding:18px;border:1px solid rgba(255,255,255,0.06);margin-bottom:18px}
.perf-weekly-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.perf-weekly-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.perf-weekly-day{text-align:center}
.perf-weekly-day-label{font-size:10px;color:#64748b;margin-bottom:4px}
.perf-weekly-day-dot{width:32px;height:32px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:18px}
.perf-weekly-msg{font-size:13px;color:#94a3b8;text-align:center;padding:8px;background:rgba(255,255,255,0.02);border-radius:10px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border-radius:14px;padding:16px;text-align:center;border:1px solid rgba(255,255,255,0.06)}
.badge.unlocked{background:rgba(255,255,255,0.05);border-color:rgba(167,139,250,0.3)}
.badge.locked{background:rgba(255,255,255,0.01);opacity:.45}
.badge-icon{font-size:32px;margin-bottom:6px}
.badge-name{font-size:12px;font-weight:700;margin-bottom:2px}
.badge-desc{font-size:10px;color:#64748b}
.badge-progress{height:4px;border-radius:99px;background:rgba(255,255,255,0.06);margin-top:8px;overflow:hidden}
.badge-progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.comp-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 16px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.06)}
.comp-label{width:75px;font-size:13px;font-weight:600}
.comp-bars{flex:1;display:flex;flex-direction:column;gap:4px}
.comp-bar-row{display:flex;align-items:center;gap:8px}
.comp-bar-year{font-size:11px;color:#64748b;width:36px}
.comp-bar-bg{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden}
.comp-bar-fill{height:100%;border-radius:99px}
.comp-bar-val{font-size:11px;font-weight:700;width:28px;text-align:right}

/* Workout plans */
.plan-card{background:rgba(255,255,255,0.03);border-radius:14px;padding:18px;border:1px solid rgba(255,255,255,0.06);margin-bottom:12px;cursor:pointer;transition:all .2s}
.plan-card:hover{border-color:rgba(167,139,250,0.3);background:rgba(255,255,255,0.05)}
.plan-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.plan-card-name{font-size:16px;font-weight:700}
.plan-card-count{font-size:12px;color:#64748b}
.plan-card-exercises{font-size:12px;color:#94a3b8;line-height:1.5}
.plan-card-last{font-size:11px;color:#7c3aed;margin-top:8px}
.plan-card-actions{display:flex;gap:8px;margin-top:10px}
.plan-card-actions button{padding:6px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer}
.wl-input{width:62px;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:13px;text-align:center;outline:none}
.wl-input:focus{border-color:#7c3aed}
.wl-set-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.wl-set-num{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#64748b;flex-shrink:0}
.wl-input-label{font-size:11px;color:#64748b;width:35px}
.wl-set-remove{background:none;border:none;color:#64748b;cursor:pointer;font-size:14px;padding:2px 6px}
.wl-add-set{background:none;border:1px dashed rgba(255,255,255,0.1);color:#94a3b8;padding:6px;border-radius:8px;width:100%;cursor:pointer;font-size:12px;margin-top:4px}
.wl-exercise{background:rgba(255,255,255,0.03);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.06)}
.wl-ex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wl-ex-name{font-size:14px;font-weight:700;color:#a78bfa}
.wl-ex-last{font-size:11px;color:#64748b;margin-bottom:8px}
.wl-empty{text-align:center;color:#64748b;padding:30px;font-size:14px}
.wl-history-item{background:rgba(255,255,255,0.03);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.06)}
.wl-history-date{font-size:13px;font-weight:700;color:#a78bfa;margin-bottom:4px}
.wl-history-plan{font-size:11px;color:#64748b;margin-bottom:8px}
.wl-history-ex{font-size:13px;margin-bottom:4px}
.wl-history-ex-name{font-weight:600;color:#e2e8f0}
.wl-history-sets{color:#94a3b8;font-size:12px}
.chart-select{margin-bottom:16px}
.chart-select select{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:14px;outline:none;width:100%}
.chart-select select option{background:#1e293b}
.chart-box{background:rgba(255,255,255,0.03);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,0.06);margin-bottom:14px}
.chart-title{font-size:14px;font-weight:700;margin-bottom:12px}
.chart-empty{text-align:center;color:#64748b;padding:20px;font-size:13px}
.add-input{display:flex;gap:8px;margin-top:14px}
.add-input input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:14px;outline:none}
.add-input input::placeholder{color:#475569}
.add-input button{padding:10px 18px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.sug-list{position:absolute;top:100%;left:0;right:70px;background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:10px;max-height:150px;overflow-y:auto;z-index:50;margin-top:4px}
.sug-item{padding:10px 14px;cursor:pointer;font-size:13px;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,0.05)}
.sug-item:hover{background:rgba(255,255,255,0.05);color:#e2e8f0}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;background:rgba(255,255,255,0.05);color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px}
.back-btn:hover{color:#e2e8f0}
</style>
</head>

function isLeap(y){return(y%4===0&&y%100!==0)||y%400===0}
function diy(y){return isLeap(y)?366:365}
function dim(y,m){return new Date(y,m+1,0).getDate()}

// Streaks
function calcStreaks(){const sorted=[...allDates].sort();if(!sorted.length)return{current:0,best:0,thisMonth:0};const today=new Date().toISOString().slice(0,10),yest=dateAdd(today,-1);let cur=0,checkD=today;if(sorted.includes(today)){cur=1;checkD=dateAdd(today,-1)}else if(sorted.includes(yest)){cur=1;checkD=dateAdd(yest,-1)}else return{current:0,best:bestStreak(sorted),thisMonth:thisMonth()};while(sorted.includes(checkD)){cur++;checkD=dateAdd(checkD,-1)}return{current:cur,best:bestStreak(sorted),thisMonth:thisMonth()}}
function bestStreak(s){if(!s.length)return 0;let b=1,c=1;for(let i=1;i<s.length;i++){const df=(new Date(s[i]+"T12:00:00")-new Date(s[i-1]+"T12:00:00"))/864e5;if(df===1){c++;if(c>b)b=c}else if(df>1)c=1}return b}
function thisMonth(){const now=new Date(),pre=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;return allDates.filter(d=>d.startsWith(pre)).length}

// Weekly
function calcWeekly(){const now=new Date(),dow=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1));const days=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d.toISOString().slice(0,10))}const trained=days.map(d=>allDates.includes(d));const count=trained.filter(Boolean).length;const target=Math.ceil(goal/52);let msg=count>=7?"🏆 Semana perfeita!":count>=target?"✅ No ritmo da meta!":count>=target-1?"💪 Quase lá!":count>0?"⚡ Bora acelerar!":"🎯 Bora treinar!";return{days,trained,count,target,msg}}

// Badges
function calcBadges(){const sk=calcStreaks(),tot=ud();const mData=[];const now=new Date();for(let m=0;m<12;m++){const di=dim(selYear,m),mt=md(m),isPast=selYear<now.getFullYear()||(selYear===now.getFullYear()&&m<now.getMonth());mData.push({days:di,trained:mt,perfect:mt>=di&&isPast})}const pm=mData.filter(m=>m.perfect).length;const wk=calcWeekly();const cm=mData.filter(m=>m.trained/m.days>=0.9).length;
return[{i:"🔥",n:"Primeira Chama",d:"7 dias seguidos",t:7,c:sk.best},{i:"🔥",n:"Em Brasa",d:"30 dias seguidos",t:30,c:sk.best},{i:"🔥",n:"Imbatível",d:"100 dias seguidos",t:100,c:sk.best},{i:"🔥",n:"Lendário",d:"200 dias seguidos",t:200,c:sk.best},{i:"💯",n:"Centenário",d:"100 treinos no ano",t:100,c:tot},{i:"🎯",n:"Duzentos",d:"200 treinos",t:200,c:tot},{i:"⭐",n:"Trezentos",d:"300 treinos",t:300,c:tot},{i:"🏆",n:"Meta Batida",d:`${goal} treinos`,t:goal,c:tot},{i:"📅",n:"Mês Perfeito",d:"Todos os dias do mês",t:1,c:pm},{i:"📅",n:"3 Meses Perfeitos",d:"3 meses 100%",t:3,c:pm},{i:"🗓️",n:"Semana Perfeita",d:"7 dias na semana",t:7,c:wk.count},{i:"📈",n:"Consistente",d:"90%+ em 6 meses",t:6,c:cm}].map(b=>({...b,unlocked:b.c>=b.t,pct:Math.min(100,Math.round((b.c/b.t)*100))}))}

// Execute plan
async function startExec(planId){
  execPlan=plans.find(p=>p.id===planId);if(!execPlan)return;
  execDate=new Date().toISOString().slice(0,10);
  // Load last data for this plan
  execLastData={};
  if(execPlan.lastLog){
    const{data:sets}=await sb.from("exercise_sets").select("exercise_name,set_number,reps,weight_kg").eq("workout_log_id",execPlan.lastLog.id).order("set_number");
    (sets||[]).forEach(s=>{if(!execLastData[s.exercise_name])execLastData[s.exercise_name]=[];execLastData[s.exercise_name].push({reps:s.reps,weight:parseFloat(s.weight_kg)})});
  }
  // Build exec sets from plan exercises, pre-filled with last data
  execSets=execPlan.exercises.map(ex=>{
    const last=execLastData[ex.exercise_name];
    const numSets=last?last.length:ex.default_sets;
    const sets=[];
    for(let i=0;i<numSets;i++){sets.push({reps:last?last[i]?.reps||ex.default_reps:ex.default_reps,weight:last?last[i]?.weight||0:0})}
    return{name:ex.exercise_name,sets,lastSets:last||null};
  });
  wlView="exec";render();
}

function execAddSet(i){execSets[i].sets.push({reps:12,weight:0});render()}
function execRemoveSet(i,j){execSets[i].sets.splice(j,1);render()}
function execUpdateSet(i,j,f,v){execSets[i].sets[j][f]=parseFloat(v)||0}
function execChangeDate(d){const dt=new Date(execDate+"T12:00:00");dt.setDate(dt.getDate()+d);execDate=dt.toISOString().slice(0,10);render()}

async function saveExec(){
  if(!execPlan||execSets.length===0)return;
  const{data:log}=await sb.from("workout_logs").insert({user_id:user.id,date:execDate,plan_id:execPlan.id}).select("id").single();
  if(!log)return;
  const rows=[];
  for(const ex of execSets){for(let s=0;s<ex.sets.length;s++){rows.push({workout_log_id:log.id,exercise_name:ex.name,set_number:s+1,reps:ex.sets[s].reps,weight_kg:ex.sets[s].weight})}}
  if(rows.length)await sb.from("exercise_sets").insert(rows);
  alert("Treino salvo!");
  await loadPlans();wlView="plans";render();
}

async function loadEvolution(ex){
  if(!ex){wlChartData=[];render();return}wlChartEx=ex;
  const{data:logs}=await sb.from("workout_logs").select("id,date").eq("user_id",user.id).order("date");
  if(!logs||!logs.length){wlChartData=[];render();return}
  const ids=logs.map(l=>l.id);
  const{data:sets}=await sb.from("exercise_sets").select("workout_log_id,reps,weight_kg").in("workout_log_id",ids).eq("exercise_name",ex);
  const lm={};logs.forEach(l=>lm[l.id]=l.date);const bd={};
  (sets||[]).forEach(s=>{const d=lm[s.workout_log_id];if(!d)return;if(!bd[d])bd[d]={maxWeight:0,totalVol:0,totalReps:0};const w=parseFloat(s.weight_kg);bd[d].maxWeight=Math.max(bd[d].maxWeight,w);bd[d].totalVol+=w*s.reps;bd[d].totalReps+=s.reps});
  wlChartData=Object.entries(bd).map(([d,v])=>({date:d,...v})).sort((a,b)=>a.date.localeCompare(b.date));render()
}

function drawChart(data,key,color,w=320,h=160){
  if(data.length<2)return`<div class="chart-empty">Precisa de 2+ treinos para ver evolução</div>`;
  const vals=data.map(d=>d[key]),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const pd=30,pw=w-pd*2,ph=h-pd*2;
  const pts=data.map((d,i)=>({x:pd+(i/(data.length-1))*pw,y:h-pd-((d[key]-mn)/rng)*ph}));
  let svg=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">`;
  for(let i=0;i<=4;i++){const y=pd+(i/4)*ph,v=mx-((i/4)*rng);svg+=`<line x1="${pd}" y1="${y}" x2="${w-pd}" y2="${y}" stroke="rgba(255,255,255,0.05)"/><text x="${pd-4}" y="${y+4}" fill="#64748b" font-size="9" text-anchor="end">${Math.round(v)}</text>`}
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");
  svg+=`<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;
  svg+=`<path d="${pathD} L${pts[pts.length-1].x},${h-pd} L${pts[0].x},${h-pd} Z" fill="${color}" opacity=".1"/>`;
  pts.forEach(p=>{svg+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="#0f172a" stroke-width="2"/>`});
  const idxs=data.length<=10?data.map((_,i)=>i):[0,Math.floor(data.length/2),data.length-1];
  idxs.forEach(i=>{svg+=`<text x="${pts[i].x}" y="${h-8}" fill="#64748b" font-size="8" text-anchor="middle">${data[i].date.slice(5)}</text>`});
  return svg+`</svg>`;
}

function renderModal(){
  if(!modal)return"";const cats={};Object.entries(TYPES).forEach(([k,v])=>{if(!cats[v.cat])cats[v.cat]=[];cats[v.cat].push(k)});
  let h=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Registrar Treino</h3><div class="modal-date">${fdf(modal.date)}</div>`;
  for(const[cat,keys]of Object.entries(cats)){h+=`<div class="modal-cat">${cat}</div><div class="modal-types">`;for(const k of keys){const t=TYPES[k],sel=modalSel.has(k);h+=`<div class="type-btn ${sel?"sel":""}" style="--tc:${t.color}" onclick="toggleTypeM('${k}')"><span class="type-icon">${t.icon}</span>${t.name}</div>`}h+=`</div>`}
  h+=`<div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="saveModal()">Salvar</button></div></div></div>`;return h
}

function renderWorkout(){
  let h=`<div class="nav" style="margin-bottom:14px"><button class="${wlView==="plans"||wlView==="edit"||wlView==="exec"?"on":"off"}" onclick="wlView='plans';render()">Meus Planos</button><button class="${wlView==="history"?"on":"off"}" onclick="wlView='history';loadHistory()">Histórico</button><button class="${wlView==="evolution"?"on":"off"}" onclick="wlView='evolution';wlChartEx=wlSavedEx[0]||'';loadEvolution(wlChartEx)">Evolução</button></div>`;

  if(wlView==="plans"){
    if(plans.length===0)h+=`<div class="wl-empty">Nenhum plano criado ainda.<br>Crie seu primeiro plano abaixo!</div>`;
    plans.forEach(p=>{
      h+=`<div class="plan-card"><div class="plan-card-header"><span class="plan-card-name">📋 ${p.name}</span><span class="plan-card-count">${p.exercises.length} exercícios</span></div>`;
      if(p.exercises.length)h+=`<div class="plan-card-exercises">${p.exercises.map(e=>e.exercise_name).join(" · ")}</div>`;
      if(p.lastLog)h+=`<div class="plan-card-last">Último treino: ${fdf(p.lastLog.date)}</div>`;
      h+=`<div class="plan-card-actions"><button class="btn-primary" style="font-size:12px;padding:8px 16px" onclick="startExec(${p.id})">▶ Executar</button><button class="btn-sm" onclick="openEditPlan(${p.id})">✏️ Editar</button><button style="padding:6px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:rgba(239,68,68,0.1);color:#f87171" onclick="deletePlan(${p.id})">🗑️</button></div></div>`;
    });
    h+=`<div class="add-input"><input id="new-plan-input" placeholder="Nome do plano (ex: Treino de Peito)" onkeydown="if(event.key==='Enter')createPlan()"/><button onclick="createPlan()">Criar</button></div>`;

  }else if(wlView==="edit"&&editPlan){
    h+=`<button class="back-btn" onclick="wlView='plans';render()">← Voltar</button>`;
    h+=`<h3 style="font-size:18px;font-weight:700;margin-bottom:14px">✏️ ${editPlan.name}</h3>`;
    if(!editPlan.exercises.length)h+=`<div class="wl-empty">Nenhum exercício ainda. Adicione abaixo!</div>`;
    editPlan.exercises.forEach((ex,i)=>{
      h+=`<div class="wl-exercise"><div class="wl-ex-header"><span class="wl-ex-name">${ex.exercise_name}</span><button style="background:none;border:none;color:#f87171;font-size:12px;cursor:pointer" onclick="removeExFromPlan(${ex.id})">✕ Remover</button></div></div>`;
    });
    // Add exercise
    const filtered=addExQuery?[...new Set([...wlSavedEx,...ALL_CAT])].filter(e=>e.toLowerCase().includes(addExQuery)):[];
    const added=new Set(editPlan.exercises.map(e=>e.exercise_name));
    h+=`<div style="position:relative"><div class="add-input"><input id="add-ex-input" placeholder="Buscar exercício..." oninput="showCatalog=false;addExQuery=this.value.trim().toLowerCase();render()" onkeydown="if(event.key==='Enter'){event.preventDefault();const v=this.value.trim();if(v){addExToPlan(v)}}"/><button onclick="const v=document.getElementById('add-ex-input').value.trim();if(v)addExToPlan(v)">Adicionar</button></div>`;
    if(filtered.length&&!showCatalog){h+=`<div class="sug-list">`;filtered.filter(e=>!added.has(e)).slice(0,8).forEach(e=>{h+=`<div class="sug-item" onclick="addExToPlan('${e}')">${e}</div>`});h+=`</div>`}
    h+=`</div>`;
    h+=`<button style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#a78bfa;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px" onclick="showCatalog=!showCatalog;render()">${showCatalog?"▲ Fechar catálogo":"▼ Catálogo de exercícios"}</button>`;
    if(showCatalog){h+=`<div style="margin-top:12px">`;for(const[group,exs]of Object.entries(EX_CATALOG)){h+=`<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px">${group}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;exs.forEach(ex=>{const isA=added.has(ex.n);h+=`<div onclick="${isA?"":"addExToPlan('"+ex.n+"')"}" style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;border:1px solid ${isA?"rgba(167,139,250,0.3)":"rgba(255,255,255,0.06)"};background:${isA?"rgba(167,139,250,0.1)":"rgba(255,255,255,0.02)"};cursor:${isA?"default":"pointer"};font-size:12px;color:${isA?"#a78bfa":"#94a3b8"}"><span>${ex.i}</span>${ex.n}${isA?'<span style="margin-left:auto;font-size:10px">✓</span>':""}</div>`});h+=`</div>`}h+=`</div>`}

  }else if(wlView==="exec"&&execPlan){
    h+=`<button class="back-btn" onclick="wlView='plans';render()">← Voltar</button>`;
    h+=`<h3 style="font-size:18px;font-weight:700;margin-bottom:4px">▶ ${execPlan.name}</h3>`;
    // Date nav
    h+=`<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 16px"><button style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="execChangeDate(-1)">‹</button><span style="font-size:14px;font-weight:700;min-width:180px;text-align:center">${fdf(execDate)}</span><button style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="execChangeDate(1)">›</button></div>`;

    execSets.forEach((ex,i)=>{
      h+=`<div class="wl-exercise"><div class="wl-ex-header"><span class="wl-ex-name">🏋️ ${ex.name}</span></div>`;
      if(ex.lastSets)h+=`<div class="wl-ex-last" style="font-size:11px;color:#64748b;margin-bottom:8px">Último: ${ex.lastSets.map((s,j)=>`${s.weight}kg×${s.reps}`).join(" / ")}</div>`;
      ex.sets.forEach((s,j)=>{
        h+=`<div class="wl-set-row"><div class="wl-set-num">${j+1}</div><span class="wl-input-label">Reps</span><input class="wl-input" type="number" value="${s.reps}" onchange="execUpdateSet(${i},${j},'reps',this.value)"/><span class="wl-input-label">Kg</span><input class="wl-input" type="number" step="0.5" value="${s.weight}" onchange="execUpdateSet(${i},${j},'weight',this.value)"/><button class="wl-set-remove" onclick="execRemoveSet(${i},${j})">✕</button></div>`;
      });
      h+=`<button class="wl-add-set" onclick="execAddSet(${i})">+ Adicionar série</button></div>`;
    });
    h+=`<div style="margin-top:16px"><button class="btn-primary" style="width:100%;padding:14px;font-size:15px;border-radius:12px;border:none;cursor:pointer" onclick="saveExec()">💾 Salvar Treino</button></div>`;

  }else if(wlView==="history"){
    if(!wlHistory.length)h+=`<div class="wl-empty">Nenhum treino registrado ainda.</div>`;
    wlHistory.forEach(w=>{h+=`<div class="wl-history-item"><div class="wl-history-date">${fdf(w.date)}</div>`;if(w.planName)h+=`<div class="wl-history-plan">📋 ${w.planName}</div>`;w.exercises.forEach(ex=>{h+=`<div class="wl-history-ex"><span class="wl-history-ex-name">${ex.name}</span><div class="wl-history-sets">`;ex.sets.forEach(s=>{h+=`<span style="margin-right:10px">S${s.set_number}: ${s.reps}×${parseFloat(s.weight_kg)}kg</span>`});h+=`</div></div>`});h+=`</div>`});

  }else if(wlView==="evolution"){
    h+=`<div class="chart-select"><select onchange="loadEvolution(this.value)"><option value="">Selecione um exercício</option>`;wlSavedEx.forEach(e=>{h+=`<option value="${e}" ${e===wlChartEx?"selected":""}>${e}</option>`});h+=`</select></div>`;
    if(wlChartEx&&wlChartData.length>0){
      h+=`<div class="chart-box"><div class="chart-title">Carga máxima (kg) — ${wlChartEx}</div>${drawChart(wlChartData,"maxWeight","#a78bfa")}</div>`;
      h+=`<div class="chart-box"><div class="chart-title">Volume total (kg × reps)</div>${drawChart(wlChartData,"totalVol","#22d3ee")}</div>`;
      h+=`<div class="chart-box"><div class="chart-title">Repetições totais</div>${drawChart(wlChartData,"totalReps","#4ade80")}</div>`;
    }else if(wlChartEx)h+=`<div class="wl-empty">Nenhum dado para este exercício.</div>`;
  }
  return h;
}

function renderPerf(){
  const sk=calcStreaks(),wk=calcWeekly(),badges=calcBadges(),tot=ud();
  let h=`<div class="perf-section"><div class="perf-section-title">🔥 Streaks</div><div class="perf-streak-cards"><div class="perf-streak-card"><div class="perf-streak-icon">🔥</div><div class="perf-streak-val" style="color:#f97316">${sk.current}</div><div class="perf-streak-label">Streak atual</div></div><div class="perf-streak-card"><div class="perf-streak-icon">🏆</div><div class="perf-streak-val" style="color:#fbbf24">${sk.best}</div><div class="perf-streak-label">Melhor streak</div></div><div class="perf-streak-card"><div class="perf-streak-icon">📅</div><div class="perf-streak-val" style="color:#a78bfa">${sk.thisMonth}</div><div class="perf-streak-label">Este mês</div></div><div class="perf-streak-card"><div class="perf-streak-icon">📊</div><div class="perf-streak-val" style="color:#22d3ee">${tot}</div><div class="perf-streak-label">Total ${selYear}</div></div></div></div>`;
  // Weekly
  h+=`<div class="perf-section"><div class="perf-section-title">📋 Resumo Semanal</div><div class="perf-weekly"><div class="perf-weekly-header"><span style="font-size:13px;color:#94a3b8">Semana atual</span><span style="font-size:13px;font-weight:700">${wk.count}/7</span></div><div class="perf-weekly-grid">`;
  const dl=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  wk.days.forEach((d,i)=>{const done=wk.trained[i],isT=d===new Date().toISOString().slice(0,10),isF=d>new Date().toISOString().slice(0,10);h+=`<div class="perf-weekly-day"><div class="perf-weekly-day-label">${dl[i]}</div><div class="perf-weekly-day-dot" style="background:${done?"rgba(124,58,237,0.2)":isF?"transparent":"rgba(255,255,255,0.03)"};border:${isT?"2px solid #a78bfa":"1px solid rgba(255,255,255,0.06)"}">${done?"✅":isF?"":"—"}</div></div>`});
  h+=`</div><div class="perf-weekly-msg">${wk.msg}</div><div style="margin-top:10px"><div class="prow"><span>Meta semanal (~${wk.target} dias)</span><span>${wk.count}/${wk.target}</span></div><div class="bbg"><div class="bfill" style="width:${Math.min(100,Math.round((wk.count/wk.target)*100))}%;background:${wk.count>=wk.target?"linear-gradient(90deg,#22c55e,#4ade80)":"linear-gradient(90deg,#7c3aed,#a78bfa)"}"></div></div></div></div></div>`;
  // Badges
  const unl=badges.filter(b=>b.unlocked).length;
  h+=`<div class="perf-section"><div class="perf-section-title">🏅 Conquistas</div><div style="font-size:13px;color:#94a3b8;margin-bottom:12px">${unl}/${badges.length} desbloqueadas</div><div class="badge-grid">`;
  badges.forEach(b=>{h+=`<div class="badge ${b.unlocked?"unlocked":"locked"}"><div class="badge-icon">${b.i}</div><div class="badge-name">${b.n}</div><div class="badge-desc">${b.d}</div>${b.unlocked?`<div style="font-size:10px;color:#4ade80;margin-top:6px">✓ Desbloqueada!</div>`:`<div class="badge-progress"><div class="badge-progress-fill" style="width:${b.pct}%"></div></div><div style="font-size:10px;color:#64748b;margin-top:4px">${b.pct}%</div>`}</div>`});
  h+=`</div></div>`;
  // Comparison
  h+=`<div class="perf-section"><div class="perf-section-title">📊 Comparativo Ano vs Ano</div><div style="margin-bottom:14px"><select style="padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:14px;outline:none;width:100%" onchange="loadCompYear(parseInt(this.value)||null)"><option value="">Selecione um ano</option>`;
  for(let y=MIN_Y;y<=MAX_Y;y++){if(y!==selYear)h+=`<option value="${y}" ${y===compYear?"selected":""}>${y}</option>`}
  h+=`</select></div>`;
  if(compYear){const cu=new Set(compData.map(e=>e.date));h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px"><div class="card"><div class="card-label">${selYear}</div><div class="card-value" style="color:#a78bfa">${tot}</div><div class="card-sub">dias</div></div><div class="card"><div class="card-label">${compYear}</div><div class="card-value" style="color:#22d3ee">${cu.size}</div><div class="card-sub">dias</div></div></div>`;
  for(let m=0;m<12;m++){const di=dim(selYear,m),curMd=md(m),cp=`${compYear}-${String(m+1).padStart(2,"0")}`,compMd=new Set(compData.filter(e=>e.date.startsWith(cp)).map(e=>e.date)).size;h+=`<div class="comp-row"><span class="comp-label">${MN[m].slice(0,3)}</span><div class="comp-bars"><div class="comp-bar-row"><span class="comp-bar-year">${selYear}</span><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${(curMd/di)*100}%;background:#a78bfa"></div></div><span class="comp-bar-val" style="color:#a78bfa">${curMd}</span></div><div class="comp-bar-row"><span class="comp-bar-year">${compYear}</span><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${(compMd/dim(compYear,m))*100}%;background:#22d3ee"></div></div><span class="comp-bar-val" style="color:#22d3ee">${compMd}</span></div></div></div>`}}
  h+=`</div>`;return h
}

function render(){
  const R=document.getElementById("root");
  if(!user){R.innerHTML=`<div class="auth-box"><h1>TREINO TRACKER</h1><p>Acompanhe seus treinos, ano a ano</p><button class="btn-google" onclick="loginGoogle()">${GSVG} Entrar com Google</button></div>`;return}
  const now=new Date(),dy=doy(),td=diy(selYear),tot=ud(),exp=Math.round((goal/td)*dy),diff=tot-exp;
  const apx=dy>0?Math.round((tot/dy)*100):0,name=user.user_metadata?.full_name||user.email;
  const cy=isCY(),yd=selYear<now.getFullYear();
  let h=`<div class="topbar"><span class="topbar-user">${name}</span><button class="btn-sm" onclick="logout()">Sair</button></div>`;
  h+=`<div class="year-nav"><button onclick="changeYear(-1)" ${selYear<=MIN_Y?"disabled":""}>‹</button><span class="year-label">${selYear}</span><button onclick="changeYear(1)" ${selYear>=MAX_Y?"disabled":""}>›</button></div>`;
  if(!cy)h+=`<div class="year-current" onclick="goCurrentYear()">← Voltar para ${now.getFullYear()}</div>`;
  h+=`<div class="goal-wrap"><span>Meta:</span><input type="number" min="1" max="366" value="${goal}" onchange="setGoal(this.value)"/><span>de ${td} dias</span></div>`;
  const rl=yd?(diff>=0?"meta batida":"meta não batida"):(diff>=0?"adiantado":"atrasado");
  const crds=[{l:"Dias treinados",v:tot,s:`de ${goal}`,c:"#a78bfa"},{l:yd?"Dias no ano":"Dias restantes",v:yd?td:Math.max(0,td-dy),s:yd?"total":"do ano",c:"#38bdf8"},{l:"Ritmo",v:(diff>=0?"+":"")+diff,s:rl,c:diff>=0?"#4ade80":"#f87171"},{l:"Aproveitamento",v:(yd?Math.round((tot/td)*100):apx)+"%",s:yd?"do ano":"até agora",c:"#facc15"}];
  h+=`<div class="cards">${crds.map(c=>`<div class="card"><div class="card-label">${c.l}</div><div class="card-value" style="color:${c.c}">${c.v}</div><div class="card-sub">${c.s}</div></div>`).join("")}</div>`;
  const p1=Math.min(100,Math.round((tot/goal)*100)),p2=Math.min(100,Math.round((dy/td)*100));
  h+=`<div class="pbox"><div class="prow"><span>Progresso da Meta</span><span>${tot}/${goal}</span></div><div class="bbg"><div class="bfill" style="width:${p1}%;background:linear-gradient(90deg,#7c3aed,#a78bfa)"></div></div><div class="prow"><span>Progresso do Ano</span><span>${dy}/${td}</span></div><div class="bbg"><div class="bfill" style="width:${p2}%;background:linear-gradient(90deg,#1e40af,#38bdf8)"></div></div></div>`;
  h+=`<div class="nav"><button class="${view==="calendar"?"on":"off"}" onclick="view='calendar';render()">Calendário</button><button class="${view==="stats"?"on":"off"}" onclick="view='stats';render()">Mensal</button><button class="${view==="types"?"on":"off"}" onclick="view='types';render()">Por Tipo</button><button class="${view==="workout"?"on":"off"}" onclick="view='workout';wlView='plans';render()">🏋️ Musculação</button><button class="${view==="performance"?"on":"off"}" onclick="view='performance';render()">🏅 Desempenho</button></div>`;

  if(view==="calendar"){
    const ut=new Set(ye().map(e=>e.type));if(ut.size){h+=`<div class="legend">`;for(const t of ut){const ty=TYPES[t];if(ty)h+=`<div class="legend-item"><div class="legend-dot" style="background:${ty.color}"></div>${ty.name}</div>`}h+=`</div>`}
    h+=`<div class="mgrid">`;for(let m=0;m<12;m++){const di=dim(selYear,m),f=fdow(selYear,m),tr=md(m),pct=Math.round((tr/di)*100),isCM=cy&&now.getMonth()===m,tdx=now.getDate();h+=`<div class="mbox"><div class="mhead"><span class="mname">${MN[m]}</span><span class="mbadge" style="background:${pbg(pct)};color:${pcl(pct)}">${tr}/${di} · ${pct}%</span></div><div class="dwh">${DW.map(d=>`<span>${d}</span>`).join("")}</div><div class="dgrid">`;for(let i=0;i<f;i++)h+=`<div class="dcell"><div class="dnum empty"></div></div>`;for(let d=1;d<=di;d++){const date=ds(selYear,m,d),types=dt(date),has=types.length>0,isT=isCM&&d===tdx;h+=`<div class="dcell" onclick="openModal(${m},${d})"><div class="dnum ${has?"tr":"notr"} ${isT?"today":""}">${d}</div>`;if(has){h+=`<div class="dots">`;for(const t of types.slice(0,4)){const ty=TYPES[t];if(ty)h+=`<div class="dot" style="background:${ty.color}"></div>`}h+=`</div>`}h+=`</div>`}h+=`</div></div>`}h+=`</div>`;
  }else if(view==="stats"){
    h+=`<div class="slist">`;for(let m=0;m<12;m++){const di=dim(selYear,m),tr=md(m),pct=Math.round((tr/di)*100),cur=cy&&now.getMonth()===m;h+=`<div class="sr ${cur?"cur":""}"><span class="sn">${MN[m]}</span><div class="sbbg"><div class="sbf" style="width:${pct}%;background:${bgr(pct)}"></div></div><span class="sp ${pcc(pct)}">${pct}%</span><span class="sc">${tr}/${di}</span></div>`}h+=`</div>`;
  }else if(view==="types"){
    const yex=ye(),counts={};yex.forEach(e=>{counts[e.type]=(counts[e.type]||0)+1});const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    h+=`<div class="type-stats">`;for(const[k,c]of sorted){const t=TYPES[k];if(!t)continue;h+=`<div class="ts-card"><div class="ts-icon">${t.icon}</div><div class="ts-info"><div class="ts-name">${t.name}</div><div class="ts-val" style="color:${t.color}">${c}</div></div></div>`}if(!sorted.length)h+=`<div style="text-align:center;color:#64748b;grid-column:1/-1;padding:40px">Nenhum treino em ${selYear}</div>`;h+=`</div>`;
    if(sorted.length){h+=`<div style="margin-top:10px">`;for(const[k,c]of sorted){const t=TYPES[k];if(!t)continue;const pct=tot>0?Math.min(100,Math.round((c/tot)*100)):0;h+=`<div class="sr" style="margin-bottom:8px"><span style="font-size:18px;width:30px;text-align:center">${t.icon}</span><span class="sn">${t.name}</span><div class="sbbg"><div class="sbf" style="width:${pct}%;background:${t.color}"></div></div><span class="sp" style="color:${t.color}">${c}x</span></div>`}h+=`</div>`}
  }else if(view==="workout"){h+=renderWorkout()}
  else if(view==="performance"){h+=renderPerf()}
  h+=`<p class="footer">Toque no dia para registrar · Sincronizado na nuvem</p>`;
  h+=renderModal();R.innerHTML=h;
}

(async()=>{const{data:{session}}=await sb.auth.getSession();if(session){user=session.user;await loadData()}else render();sb.auth.onAuthStateChange(async(ev,s)=>{if(ev==="SIGNED_IN"&&s){user=s.user;await loadData()}else if(ev==="SIGNED_OUT"){user=null;entries=[];allDates=[];goal=350;render()}})})();
</script>
