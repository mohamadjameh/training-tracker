function isLeap(y){return(y%4===0&&y%100!==0)||y%400===0}
function daysInYear(y){return isLeap(y)?366:365}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function fdow(y,m){return new Date(y,m,1).getDay()}
function ds(y,m,d){return`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}

function dayOfYear(){const n=new Date();if(selYear<n.getFullYear())return daysInYear(selYear);if(selYear>n.getFullYear())return 0;return Math.floor((n-new Date(selYear,0,0))/864e5)}

function fmtDate(s){const p=s.split("-");return`${parseInt(p[2])} de ${MN[parseInt(p[1])-1]}`}
function fmtDateFull(s){const p=s.split("-");return`${parseInt(p[2])} de ${MN[parseInt(p[1])-1]} de ${p[0]}`}

const GSVG=`<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>`;

function changeYear(d){const n=selYear+d;if(n>=MIN_YEAR&&n<=MAX_YEAR){selYear=n;loadData()}}
function goCurrentYear(){selYear=new Date().getFullYear();loadData()}

async function loginGoogle(){await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:SITE}})}
async function logout(){await sb.auth.signOut();user=null;entries=[];goal=350;render()}

async function loadData(){
  const{data:p}=await sb.from("profiles").select("goal").eq("id",user.id).single();
  if(p)goal=p.goal;else{await sb.from("profiles").insert({id:user.id,goal:350});goal=350}
  const sd=`${selYear}-01-01`,ed=`${selYear}-12-31`;
  const{data:d}=await sb.from("training_days").select("date,type").eq("user_id",user.id).gte("date",sd).lte("date",ed);
  entries=d||[];
  // Load saved exercises
  const{data:ue}=await sb.from("user_exercises").select("name,muscle_group").eq("user_id",user.id).order("name");
  wlSavedExercises=(ue||[]).map(e=>e.name);
  render();
}

// Training day modal
function openModal(m,d){modal={m,d,date:ds(selYear,m,d)};modalSel=new Set(dayTypes(modal.date));render()}
function toggleTypeM(t){if(modalSel.has(t))modalSel.delete(t);else modalSel.add(t);render()}
async function saveModal(){
  if(!modal)return;const date=modal.date,existing=dayTypes(date);
  for(const t of existing.filter(t=>!modalSel.has(t))){await sb.from("training_days").delete().eq("user_id",user.id).eq("date",date).eq("type",t);entries=entries.filter(e=>!(e.date===date&&e.type===t))}
  for(const t of[...modalSel].filter(t=>!existing.includes(t))){await sb.from("training_days").insert({user_id:user.id,date,type:t});entries.push({date,type:t})}
  modal=null;render();
}
function closeModal(){modal=null;render()}
async function setGoal(v){const n=parseInt(v);if(isNaN(n)||n<1||n>366)return;goal=n;await sb.from("profiles").update({goal:n}).eq("id",user.id);render()}

// Workout log functions
function wlChangeDate(delta){
  const d=new Date(wlDate+"T12:00:00");d.setDate(d.getDate()+delta);
  wlDate=d.toISOString().slice(0,10);wlExercises=[];wlLogId=null;loadWorkoutForDate();
}

async function loadWorkoutForDate(){
  const{data:logs}=await sb.from("workout_logs").select("id").eq("user_id",user.id).eq("date",wlDate);
  if(logs&&logs.length>0){
    wlLogId=logs[0].id;
    const{data:sets}=await sb.from("exercise_sets").select("exercise_name,set_number,reps,weight_kg").eq("workout_log_id",wlLogId).order("exercise_name").order("set_number");
    const ex={};
    (sets||[]).forEach(s=>{if(!ex[s.exercise_name])ex[s.exercise_name]=[];ex[s.exercise_name].push({reps:s.reps,weight:parseFloat(s.weight_kg)})});
    wlExercises=Object.entries(ex).map(([name,sets])=>({name,sets}));
  }else{wlLogId=null;wlExercises=[]}
  render();
}

function wlAddExercise(){
  const input=document.getElementById("wl-ex-input");if(!input)return;
  const name=input.value.trim();if(!name)return;
  wlExercises.push({name,sets:[{reps:12,weight:0}]});
  wlSugQuery="";input.value="";wlShowCatalog=false;render();
}
function wlAddFromCatalog(name){
  wlExercises.push({name,sets:[{reps:12,weight:0}]});
  wlShowCatalog=false;render();
}
function wlToggleCatalog(){wlShowCatalog=!wlShowCatalog;render()}

function wlRemoveExercise(i){wlExercises.splice(i,1);render()}
function wlAddSet(i){wlExercises[i].sets.push({reps:12,weight:0});render()}
function wlRemoveSet(i,j){wlExercises[i].sets.splice(j,1);if(wlExercises[i].sets.length===0)wlExercises.splice(i,1);render()}

function wlUpdateSet(i,j,field,val){
  const v=parseFloat(val)||0;
  wlExercises[i].sets[j][field]=v;
  // Don't re-render on input to keep focus
}

function wlShowSuggestions(val){wlSugQuery=val.trim().toLowerCase();render()}

async function wlSave(){
  if(wlExercises.length===0)return;
  // Delete old log if exists
  if(wlLogId){await sb.from("exercise_sets").delete().eq("workout_log_id",wlLogId);await sb.from("workout_logs").delete().eq("id",wlLogId)}
  // Create new log
  const{data:log}=await sb.from("workout_logs").insert({user_id:user.id,date:wlDate}).select("id").single();
  if(!log)return;
  wlLogId=log.id;
  // Insert all sets
  const rows=[];
  for(const ex of wlExercises){
    for(let s=0;s<ex.sets.length;s++){
      rows.push({workout_log_id:log.id,exercise_name:ex.name,set_number:s+1,reps:ex.sets[s].reps,weight_kg:ex.sets[s].weight});
    }
    // Save exercise name
    await sb.from("user_exercises").upsert({user_id:user.id,name:ex.name},{onConflict:"user_id,name"}).select();
  }
  if(rows.length>0)await sb.from("exercise_sets").insert(rows);
  // Refresh saved exercises
  const{data:ue}=await sb.from("user_exercises").select("name").eq("user_id",user.id).order("name");
  wlSavedExercises=(ue||[]).map(e=>e.name);
  alert("Treino salvo!");render();
}

async function loadHistory(){
  const{data:logs}=await sb.from("workout_logs").select("id,date").eq("user_id",user.id).order("date",{ascending:false}).limit(20);
  if(!logs||logs.length===0){wlHistory=[];render();return}
  const ids=logs.map(l=>l.id);
  const{data:sets}=await sb.from("exercise_sets").select("workout_log_id,exercise_name,set_number,reps,weight_kg").in("workout_log_id",ids).order("set_number");
  wlHistory=logs.map(l=>{
    const exSets=(sets||[]).filter(s=>s.workout_log_id===l.id);
    const exMap={};
    exSets.forEach(s=>{if(!exMap[s.exercise_name])exMap[s.exercise_name]=[];exMap[s.exercise_name].push(s)});
    return{date:l.date,exercises:Object.entries(exMap).map(([n,ss])=>({name:n,sets:ss}))};
  });
  render();
}

async function loadEvolution(exName){
  if(!exName){wlChartData=[];render();return}
  wlChartExercise=exName;
  const{data:logs}=await sb.from("workout_logs").select("id,date").eq("user_id",user.id).order("date");
  if(!logs||logs.length===0){wlChartData=[];render();return}
  const ids=logs.map(l=>l.id);
  const{data:sets}=await sb.from("exercise_sets").select("workout_log_id,reps,weight_kg").in("workout_log_id",ids).eq("exercise_name",exName).order("set_number");
  const logMap={};logs.forEach(l=>logMap[l.id]=l.date);
  const byDate={};
  (sets||[]).forEach(s=>{
    const d=logMap[s.workout_log_id];if(!d)return;
    if(!byDate[d])byDate[d]={maxWeight:0,totalVol:0,totalReps:0,sets:0};
    const w=parseFloat(s.weight_kg);
    byDate[d].maxWeight=Math.max(byDate[d].maxWeight,w);
    byDate[d].totalVol+=w*s.reps;
    byDate[d].totalReps+=s.reps;
    byDate[d].sets++;
  });
  wlChartData=Object.entries(byDate).map(([d,v])=>({date:d,...v})).sort((a,b)=>a.date.localeCompare(b.date));
  render();
}

function drawChart(data,key,label,color,w=320,h=160){
  if(data.length<2)return`<div class="chart-empty">Precisa de pelo menos 2 treinos para ver a evolução</div>`;
  const vals=data.map(d=>d[key]),minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=maxV-minV||1;
  const pad=30,pw=w-pad*2,ph=h-pad*2;
  const pts=data.map((d,i)=>{const x=pad+(i/(data.length-1))*pw;const y=h-pad-((d[key]-minV)/range)*ph;return{x,y,d}});
  let svg=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">`;
  // Grid lines
  for(let i=0;i<=4;i++){
    const y=pad+(i/4)*ph;const v=maxV-((i/4)*range);
    svg+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
    svg+=`<text x="${pad-4}" y="${y+4}" fill="#64748b" font-size="9" text-anchor="end">${Math.round(v)}</text>`;
  }
  // Line
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");
  svg+=`<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  // Area
  svg+=`<path d="${pathD} L${pts[pts.length-1].x},${h-pad} L${pts[0].x},${h-pad} Z" fill="url(#grad-${key})" opacity="0.15"/>`;
  svg+=`<defs><linearGradient id="grad-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}"/><stop offset="100%" stop-color="transparent"/></linearGradient></defs>`;
  // Dots
  pts.forEach(p=>{svg+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="#0f172a" stroke-width="2"/>`});
  // Date labels
  if(data.length<=10){pts.forEach((p,i)=>{const dl=data[i].date.slice(5);svg+=`<text x="${p.x}" y="${h-8}" fill="#64748b" font-size="8" text-anchor="middle">${dl}</text>`})}
  else{[0,Math.floor(data.length/2),data.length-1].forEach(i=>{const dl=data[i].date.slice(5);svg+=`<text x="${pts[i].x}" y="${h-8}" fill="#64748b" font-size="8" text-anchor="middle">${dl}</text>`})}
  svg+=`</svg>`;
  return svg;
}

function renderModal(){
  if(!modal)return"";
  const dateLabel=fmtDateFull(modal.date);
  const cats={};Object.entries(TYPES).forEach(([k,v])=>{if(!cats[v.cat])cats[v.cat]=[];cats[v.cat].push(k)});
  let h=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>Registrar Treino</h3><div class="modal-date">${dateLabel}</div>`;
  for(const[cat,keys]of Object.entries(cats)){h+=`<div class="modal-cat">${cat}</div><div class="modal-types">`;for(const k of keys){const t=TYPES[k],sel=modalSel.has(k);h+=`<div class="type-btn ${sel?"sel":""}" style="--tc:${t.color}" onclick="toggleTypeM('${k}')"><span class="type-icon">${t.icon}</span>${t.name}</div>`}h+=`</div>`}
  h+=`<div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-save" onclick="saveModal()">Salvar</button></div></div></div>`;
  return h;
}

function renderWorkoutLog(){
  let h=`<div class="wl-date-nav"><button onclick="wlChangeDate(-1)">‹</button><span class="wl-date-label">${fmtDateFull(wlDate)}</span><button onclick="wlChangeDate(1)">›</button></div>`;

  // Sub nav
  h+=`<div class="nav" style="margin-bottom:14px"><button class="${wlSubView==="log"?"on":"off"}" onclick="wlSubView='log';loadWorkoutForDate()">Registrar</button><button class="${wlSubView==="history"?"on":"off"}" onclick="wlSubView='history';loadHistory()">Histórico</button><button class="${wlSubView==="evolution"?"on":"off"}" onclick="wlSubView='evolution';wlChartExercise=wlSavedExercises[0]||'';loadEvolution(wlChartExercise)">Evolução</button></div>`;

  if(wlSubView==="log"){
    if(wlExercises.length===0)h+=`<div class="wl-empty">Nenhum exercício adicionado ainda.<br>Adicione abaixo para começar.</div>`;
    wlExercises.forEach((ex,i)=>{
      h+=`<div class="wl-exercise"><div class="wl-ex-header"><span class="wl-ex-name">🏋️ ${ex.name}</span><button class="wl-ex-remove" onclick="wlRemoveExercise(${i})">✕ Remover</button></div>`;
      ex.sets.forEach((s,j)=>{
        h+=`<div class="wl-set-row"><div class="wl-set-num">${j+1}</div><span class="wl-input-label">Reps</span><input class="wl-input" type="number" value="${s.reps}" onchange="wlUpdateSet(${i},${j},'reps',this.value)"/><span class="wl-input-label">Kg</span><input class="wl-input" type="number" step="0.5" value="${s.weight}" onchange="wlUpdateSet(${i},${j},'weight',this.value)"/><button class="wl-set-remove" onclick="wlRemoveSet(${i},${j})">✕</button></div>`;
      });
      h+=`<button class="wl-add-set" onclick="wlAddSet(${i})">+ Adicionar série</button></div>`;
    });

    // Add exercise input with suggestions
    const filtered=wlSugQuery?[...new Set([...wlSavedExercises,...ALL_CATALOG_NAMES])].filter(e=>e.toLowerCase().includes(wlSugQuery)):[];
    h+=`<div class="wl-suggestions"><div class="wl-add-exercise"><input id="wl-ex-input" placeholder="Nome do exercício..." oninput="wlShowCatalog=false;wlShowSuggestions(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();wlAddExercise()}"/><button onclick="wlAddExercise()">Adicionar</button></div>`;
    if(filtered.length>0&&!wlShowCatalog){h+=`<div class="wl-sug-list">`;filtered.slice(0,8).forEach(e=>{h+=`<div class="wl-sug-item" onclick="document.getElementById('wl-ex-input').value='${e}';wlSugQuery='';render()">${e}</div>`});h+=`</div>`}
    h+=`</div>`;
    
    // Catalog button
    h+=`<button style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#a78bfa;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px" onclick="wlToggleCatalog()">${wlShowCatalog?"▲ Fechar catálogo":"▼ Escolher do catálogo de exercícios"}</button>`;

    // Catalog grid
    if(wlShowCatalog){
      h+=`<div style="margin-top:12px">`;
      const added=new Set(wlExercises.map(e=>e.name));
      for(const[group,exs]of Object.entries(EX_CATALOG)){
        h+=`<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px">${group}</div>`;
        h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;
        exs.forEach(ex=>{
          const isAdded=added.has(ex.name);
          h+=`<div onclick="${isAdded?"":"wlAddFromCatalog('"+ex.name+"')"}" style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;border:1px solid ${isAdded?"rgba(167,139,250,0.3)":"rgba(255,255,255,0.06)"};background:${isAdded?"rgba(167,139,250,0.1)":"rgba(255,255,255,0.02)"};cursor:${isAdded?"default":"pointer"};font-size:12px;color:${isAdded?"#a78bfa":"#94a3b8"}"><span>${ex.icon}</span><span>${ex.name}</span>${isAdded?'<span style="margin-left:auto;font-size:10px">✓</span>':""}</div>`;
        });
        h+=`</div>`;
      }
      h+=`</div>`;
    }

    if(wlExercises.length>0){h+=`<div class="wl-save-bar"><button class="btn-save" onclick="wlSave()">💾 Salvar Treino</button></div>`}
  }else if(wlSubView==="history"){
    if(wlHistory.length===0)h+=`<div class="wl-empty">Nenhum treino registrado ainda.</div>`;
    wlHistory.forEach(w=>{
      h+=`<div class="wl-history-item"><div class="wl-history-date">${fmtDateFull(w.date)}</div>`;
      w.exercises.forEach(ex=>{
        h+=`<div class="wl-history-ex"><span class="wl-history-ex-name">${ex.name}</span><div class="wl-history-sets">`;
        ex.sets.forEach(s=>{h+=`<span style="margin-right:10px">Série ${s.set_number}: ${s.reps} reps × ${parseFloat(s.weight_kg)}kg</span>`});
        h+=`</div></div>`;
      });
      h+=`</div>`;
    });
  }else if(wlSubView==="evolution"){
    h+=`<div class="chart-select"><select onchange="loadEvolution(this.value)"><option value="">Selecione um exercício</option>`;
    wlSavedExercises.forEach(e=>{h+=`<option value="${e}" ${e===wlChartExercise?"selected":""}>${e}</option>`});
    h+=`</select></div>`;

    if(wlChartExercise&&wlChartData.length>0){
      h+=`<div class="chart-box"><div class="chart-title">Carga máxima (kg) — ${wlChartExercise}</div>${drawChart(wlChartData,"maxWeight","Peso","#a78bfa")}</div>`;
      h+=`<div class="chart-box"><div class="chart-title">Volume total (kg × reps)</div>${drawChart(wlChartData,"totalVol","Volume","#22d3ee")}</div>`;
      h+=`<div class="chart-box"><div class="chart-title">Repetições totais</div>${drawChart(wlChartData,"totalReps","Reps","#4ade80")}</div>`;
    }else if(wlChartExercise){h+=`<div class="wl-empty">Nenhum dado encontrado para este exercício.</div>`}
  }
  return h;
}

function render(){
  const R=document.getElementById("root");
  if(!user){R.innerHTML=`<div class="auth-box"><h1>TREINO TRACKER</h1><p>Acompanhe seus treinos, ano a ano</p><button class="btn-google" onclick="loginGoogle()">${GSVG} Entrar com Google</button></div>`;return}

  const now=new Date(),doy=dayOfYear(),totalDays=daysInYear(selYear);
  const tot=uniqueDays(),exp=Math.round((goal/totalDays)*doy),diff=tot-exp;
  const apx=doy>0?Math.round((tot/doy)*100):0;
  const name=user.user_metadata?.full_name||user.email;
  const isCY=isCurrentYear(),yd=selYear<now.getFullYear();

  let h=`<div class="topbar"><span class="topbar-user">${name}</span><button class="btn-sm" onclick="logout()">Sair</button></div>`;
  h+=`<div class="year-nav"><button onclick="changeYear(-1)" ${selYear<=MIN_YEAR?"disabled":""}>‹</button><span class="year-label">${selYear}</span><button onclick="changeYear(1)" ${selYear>=MAX_YEAR?"disabled":""}>›</button></div>`;
  if(!isCY)h+=`<div class="year-current" onclick="goCurrentYear()">← Voltar para ${now.getFullYear()}</div>`;
  h+=`<div class="goal-wrap"><span>Meta:</span><input type="number" min="1" max="366" value="${goal}" onchange="setGoal(this.value)"/><span>de ${totalDays} dias</span></div>`;

  const rl=yd?(diff>=0?"meta batida":"meta não batida"):(diff>=0?"adiantado":"atrasado");
  const crds=[{l:"Dias treinados",v:tot,s:`de ${goal}`,c:"#a78bfa"},{l:yd?"Dias no ano":"Dias restantes",v:yd?totalDays:Math.max(0,totalDays-doy),s:yd?"total":"do ano",c:"#38bdf8"},{l:"Ritmo",v:(diff>=0?"+":"")+diff,s:rl,c:diff>=0?"#4ade80":"#f87171"},{l:"Aproveitamento",v:(yd?Math.round((tot/totalDays)*100):apx)+"%",s:yd?"do ano":"do ano até agora",c:"#facc15"}];
  h+=`<div class="cards">${crds.map(c=>`<div class="card"><div class="card-label">${c.l}</div><div class="card-value" style="color:${c.c}">${c.v}</div><div class="card-sub">${c.s}</div></div>`).join("")}</div>`;

  const p1=Math.min(100,Math.round((tot/goal)*100)),p2=Math.min(100,Math.round((doy/totalDays)*100));
  h+=`<div class="pbox"><div class="prow"><span>Progresso da Meta</span><span>${tot}/${goal}</span></div><div class="bbg"><div class="bfill" style="width:${p1}%;background:linear-gradient(90deg,#7c3aed,#a78bfa)"></div></div><div class="prow"><span>Progresso do Ano</span><span>${doy}/${totalDays}</span></div><div class="bbg"><div class="bfill" style="width:${p2}%;background:linear-gradient(90deg,#1e40af,#38bdf8)"></div></div></div>`;

  h+=`<div class="nav"><button class="${view==="calendar"?"on":"off"}" onclick="view='calendar';render()">Calendário</button><button class="${view==="stats"?"on":"off"}" onclick="view='stats';render()">Estatísticas</button><button class="${view==="types"?"on":"off"}" onclick="view='types';render()">Por Tipo</button><button class="${view==="workout"?"on":"off"}" onclick="view='workout';wlSubView='log';loadWorkoutForDate()">🏋️ Musculação</button></div>`;

  if(view==="calendar"){
    const ut=new Set(yearEntries().map(e=>e.type));
    if(ut.size>0){h+=`<div class="legend">`;for(const t of ut){const ty=TYPES[t];if(ty)h+=`<div class="legend-item"><div class="legend-dot" style="background:${ty.color}"></div>${ty.name}</div>`}h+=`</div>`}
    h+=`<div class="mgrid">`;
    for(let m=0;m<12;m++){
      const di=dim(selYear,m),f=fdow(selYear,m),tr=monthDays(m),pct=Math.round((tr/di)*100);
      const isCM=isCY&&now.getMonth()===m,td=now.getDate();
      h+=`<div class="mbox"><div class="mhead"><span class="mname">${MN[m]}</span><span class="mbadge" style="background:${pbg(pct)};color:${pcl(pct)}">${tr}/${di} · ${pct}%</span></div>`;
      h+=`<div class="dwh">${DW.map(d=>`<span>${d}</span>`).join("")}</div><div class="dgrid">`;
      for(let i=0;i<f;i++)h+=`<div class="dcell"><div class="dnum empty"></div></div>`;
      for(let d=1;d<=di;d++){const date=ds(selYear,m,d),types=dayTypes(date),has=types.length>0,isT=isCM&&d===td;
        h+=`<div class="dcell" onclick="openModal(${m},${d})"><div class="dnum ${has?"tr":"notr"} ${isT?"today":""}">${d}</div>`;
        if(has){h+=`<div class="dots">`;for(const t of types.slice(0,4)){const ty=TYPES[t];if(ty)h+=`<div class="dot" style="background:${ty.color}"></div>`}h+=`</div>`}
        h+=`</div>`}
      h+=`</div></div>`}
    h+=`</div>`;
  }else if(view==="stats"){
    h+=`<div class="slist">`;
    for(let m=0;m<12;m++){const di=dim(selYear,m),tr=monthDays(m),pct=Math.round((tr/di)*100),isCur=isCY&&now.getMonth()===m;
      h+=`<div class="sr ${isCur?"cur":""}"><span class="sn">${MN[m]}</span><div class="sbbg"><div class="sbf" style="width:${pct}%;background:${bg(pct)}"></div></div><span class="sp ${pc(pct)}">${pct}%</span><span class="sc">${tr}/${di}</span></div>`}
    h+=`</div>`;
  }else if(view==="types"){
    const ye=yearEntries(),counts={};ye.forEach(e=>{counts[e.type]=(counts[e.type]||0)+1});
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    h+=`<div class="type-stats">`;
    for(const[k,c]of sorted){const t=TYPES[k];if(!t)continue;h+=`<div class="ts-card"><div class="ts-icon">${t.icon}</div><div class="ts-info"><div class="ts-name">${t.name}</div><div class="ts-val" style="color:${t.color}">${c}</div></div></div>`}
    if(sorted.length===0)h+=`<div style="text-align:center;color:#64748b;grid-column:1/-1;padding:40px">Nenhum treino registrado em ${selYear}</div>`;
    h+=`</div>`;
    if(sorted.length>0){h+=`<div style="margin-top:10px">`;for(const[k,c]of sorted){const t=TYPES[k];if(!t)continue;const pct=tot>0?Math.min(100,Math.round((c/tot)*100)):0;h+=`<div class="sr" style="margin-bottom:8px"><span style="font-size:18px;width:30px;text-align:center">${t.icon}</span><span class="sn">${t.name}</span><div class="sbbg"><div class="sbf" style="width:${pct}%;background:${t.color}"></div></div><span class="sp" style="color:${t.color}">${c}x</span></div>`}h+=`</div>`}
  }else if(view==="workout"){
    h+=renderWorkoutLog();
  }

  h+=`<p class="footer">Toque no dia para registrar · Sincronizado na nuvem</p>`;
  h+=renderModal();
  R.innerHTML=h;
}

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){user=session.user;await loadData()}else render();
  sb.auth.onAuthStateChange(async(ev,s)=>{if(ev==="SIGNED_IN"&&s){user=s.user;await loadData()}else if(ev==="SIGNED_OUT"){user=null;entries=[];goal=350;render()}});
})();
</script>
</body>
</html>
