function pcc(p){return p>=90?"g":p>=70?"y":"r"}
function isCY(){return selYear===new Date().getFullYear()}
function doy(){const n=new Date();if(selYear<n.getFullYear())return diy(selYear);if(selYear>n.getFullYear())return 0;return Math.floor((n-new Date(selYear,0,0))/864e5)}
function fdf(s){const p=s.split("-");return`${parseInt(p[2])} de ${MN[parseInt(p[1])-1]} de ${p[0]}`}
function dadd(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

// Streaks
function cStreaks(){const s=[...allDates].sort();if(!s.length)return{current:0,best:0,thisMonth:0};const td=new Date().toISOString().slice(0,10),yd=dadd(td,-1);let cur=0,ck=td;if(s.includes(td)){cur=1;ck=dadd(td,-1)}else if(s.includes(yd)){cur=1;ck=dadd(yd,-1)}else return{current:0,best:bStr(s),thisMonth:tMon()};while(s.includes(ck)){cur++;ck=dadd(ck,-1)}return{current:cur,best:bStr(s),thisMonth:tMon()}}
function bStr(s){if(!s.length)return 0;let b=1,c=1;for(let i=1;i<s.length;i++){if((new Date(s[i]+"T12:00:00")-new Date(s[i-1]+"T12:00:00"))/864e5===1){c++;if(c>b)b=c}else c=1}return b}
function tMon(){const n=new Date(),p=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;return allDates.filter(d=>d.startsWith(p)).length}

// Weekly
function cWeekly(){const n=new Date(),dow=n.getDay(),mon=new Date(n);mon.setDate(n.getDate()-(dow===0?6:dow-1));const days=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d.toISOString().slice(0,10))}const tr=days.map(d=>allDates.includes(d)),cnt=tr.filter(Boolean).length,tgt=Math.ceil(goal/52);let msg=cnt>=7?"🏆 Semana perfeita!":cnt>=tgt?"✅ No ritmo da meta!":cnt>=tgt-1?"💪 Quase lá!":cnt>0?"⚡ Bora acelerar!":"🎯 Bora treinar!";return{days,tr,cnt,tgt,msg}}

// Badges
function cBadges(){const sk=cStreaks(),tot=ud(),mD=[];const n=new Date();for(let m=0;m<12;m++){const di=dim(selYear,m),mt=mdd(m),ip=selYear<n.getFullYear()||(selYear===n.getFullYear()&&m<n.getMonth());mD.push({d:di,t:mt,p:mt>=di&&ip})}const pm=mD.filter(m=>m.p).length,wk=cWeekly(),cm=mD.filter(m=>m.t/m.d>=0.9).length;
return[{i:"🔥",n:"Primeira Chama",d:"7 dias seguidos",t:7,c:sk.best},{i:"🔥",n:"Em Brasa",d:"30 dias seguidos",t:30,c:sk.best},{i:"🔥",n:"Imbatível",d:"100 dias seguidos",t:100,c:sk.best},{i:"🔥",n:"Lendário",d:"200 dias seguidos",t:200,c:sk.best},{i:"💯",n:"Centenário",d:"100 treinos",t:100,c:tot},{i:"🎯",n:"Duzentos",d:"200 treinos",t:200,c:tot},{i:"⭐",n:"Trezentos",d:"300 treinos",t:300,c:tot},{i:"🏆",n:"Meta Batida",d:`${goal} treinos`,t:goal,c:tot},{i:"📅",n:"Mês Perfeito",d:"Todos os dias",t:1,c:pm},{i:"📅",n:"3 Meses Perfeitos",d:"3 meses 100%",t:3,c:pm},{i:"🗓️",n:"Semana Perfeita",d:"7/7 na semana",t:7,c:wk.cnt},{i:"📈",n:"Consistente",d:"90%+ em 6 meses",t:6,c:cm}].map(b=>({...b,ok:b.c>=b.t,pct:Math.min(100,Math.round((b.c/b.t)*100))}))}

// Execute
async function startExec(pid){
  execPlan=plans.find(p=>p.id===pid);if(!execPlan)return;
  execDate=new Date().toISOString().slice(0,10);execLastData={};
  if(execPlan.lastLog){const{data:s}=await sb.from("exercise_sets").select("exercise_name,set_number,reps,weight_kg").eq("workout_log_id",execPlan.lastLog.id).order("set_number");(s||[]).forEach(x=>{if(!execLastData[x.exercise_name])execLastData[x.exercise_name]=[];execLastData[x.exercise_name].push({r:x.reps,w:parseFloat(x.weight_kg)})})}
  execSets=execPlan.exercises.map(ex=>{const last=execLastData[ex.exercise_name];const ns=last?last.length:ex.default_sets;const sets=[];for(let i=0;i<ns;i++)sets.push({reps:last?last[i]?.r||ex.default_reps:ex.default_reps,weight:last?last[i]?.w||0:0});return{name:ex.exercise_name,sets,last:last||null}});
  wlView="exec";render();
}
function exAddS(i){execSets[i].sets.push({reps:12,weight:0});render()}
function exRmS(i,j){execSets[i].sets.splice(j,1);render()}
function exUpS(i,j,f,v){execSets[i].sets[j][f]=parseFloat(v)||0}
function exChgD(d){const dt=new Date(execDate+"T12:00:00");dt.setDate(dt.getDate()+d);execDate=dt.toISOString().slice(0,10);render()}

async function saveExec(){
  if(!execPlan||!execSets.length)return;
  const{data:log}=await sb.from("workout_logs").insert({user_id:user.id,date:execDate,plan_id:execPlan.id}).select("id").single();
  if(!log)return;
  const rows=[];
  for(const ex of execSets)for(let s=0;s<ex.sets.length;s++)rows.push({workout_log_id:log.id,exercise_name:ex.name,set_number:s+1,reps:ex.sets[s].reps,weight_kg:ex.sets[s].weight});
  if(rows.length)await sb.from("exercise_sets").insert(rows);
  alert("Treino salvo!");await loadPlans();await openView(execPlan.id);
}

// Chart
function chart(data,key,color,w=320,h=100){
  if(data.length<2)return`<div class="cem">Precisa de 2+ treinos para ver evolução</div>`;
  const vals=data.map(d=>d[key]),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const pd=28,pw=w-pd*2,ph=h-pd*2;
  const pts=data.map((d,i)=>({x:pd+(i/(data.length-1))*pw,y:h-pd-((d[key]-mn)/rng)*ph}));
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">`;
  for(let i=0;i<=3;i++){const y=pd+(i/3)*ph,v=mx-((i/3)*rng);s+=`<line x1="${pd}" y1="${y}" x2="${w-pd}" y2="${y}" stroke="rgba(255,255,255,0.05)"/><text x="${pd-4}" y="${y+4}" fill="#64748b" font-size="8" text-anchor="end">${Math.round(v)}</text>`}
  s+=`<path d="${pts.map((p,i)=>`${i?"L":"M"}${p.x},${p.y}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
  s+=`<path d="${pts.map((p,i)=>`${i?"L":"M"}${p.x},${p.y}`).join(" ")} L${pts[pts.length-1].x},${h-pd} L${pts[0].x},${h-pd} Z" fill="${color}" opacity=".1"/>`;
  pts.forEach(p=>{s+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}" stroke="#0f172a" stroke-width="1.5"/>`});
  const ix=data.length<=8?data.map((_,i)=>i):[0,Math.floor(data.length/2),data.length-1];
  ix.forEach(i=>{s+=`<text x="${pts[i].x}" y="${h-6}" fill="#64748b" font-size="7" text-anchor="middle">${data[i].date.slice(5)}</text>`});
  return s+`</svg>`;
}

    if(showCat){h+=`<div style="margin-top:12px">`;for(const[gr,exs]of Object.entries(EXCAT)){h+=`<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px">${gr}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;exs.forEach(ex=>{const a=added.has(ex.n);h+=`<div onclick="${a?"":"addExPlan('"+ex.n+"')"}" style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;border:1px solid ${a?"rgba(167,139,250,0.3)":"rgba(255,255,255,0.06)"};background:${a?"rgba(167,139,250,0.1)":"rgba(255,255,255,0.02)"};cursor:${a?"default":"pointer"};font-size:12px;color:${a?"#a78bfa":"#94a3b8"}"><span>${ex.i}</span>${ex.n}${a?'<span style="margin-left:auto;font-size:10px">✓</span>':""}</div>`});h+=`</div>`}h+=`</div>`}

  }else if(wlView==="exec"&&execPlan){
    h+=`<button class="bbtn" onclick="openView(${execPlan.id})">← Voltar</button>`;
    h+=`<h3 style="font-size:18px;font-weight:700;margin-bottom:4px">▶ ${execPlan.name}</h3>`;
    h+=`<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 16px"><button style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="exChgD(-1)">‹</button><span style="font-size:14px;font-weight:700;min-width:180px;text-align:center">${fdf(execDate)}</span><button style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="exChgD(1)">›</button></div>`;
    execSets.forEach((ex,i)=>{
      h+=`<div class="wex"><div class="wexh"><span class="wexn">🏋️ ${ex.name}</span></div>`;
      if(ex.last)h+=`<div style="font-size:11px;color:#64748b;margin-bottom:8px">Último: ${ex.last.map(s=>`${s.w}kg×${s.r}`).join(" / ")}</div>`;
      ex.sets.forEach((s,j)=>{h+=`<div class="wsr"><div class="wsn">${j+1}</div><span class="wsl">Reps</span><input class="wi" type="number" value="${s.reps}" onchange="exUpS(${i},${j},'reps',this.value)"/><span class="wsl">Kg</span><input class="wi" type="number" step="0.5" value="${s.weight}" onchange="exUpS(${i},${j},'weight',this.value)"/><button class="wsd" onclick="exRmS(${i},${j})">✕</button></div>`});
      h+=`<button class="was" onclick="exAddS(${i})">+ Adicionar série</button></div>`;
    });
    h+=`<div style="margin-top:16px"><button class="bp" style="width:100%;padding:14px;font-size:15px;border-radius:12px;border:none;cursor:pointer" onclick="saveExec()">💾 Salvar Treino</button></div>`;
  }
  return h;
}

// Render Performance
function rPerf(){
  const sk=cStreaks(),wk=cWeekly(),badges=cBadges(),tot=ud();
  let h=`<div class="psec"><div class="pst">🔥 Streaks</div><div class="psc"><div class="psk"><div class="psi">🔥</div><div class="psv" style="color:#f97316">${sk.current}</div><div class="psl">Streak atual</div></div><div class="psk"><div class="psi">🏆</div><div class="psv" style="color:#fbbf24">${sk.best}</div><div class="psl">Melhor streak</div></div><div class="psk"><div class="psi">📅</div><div class="psv" style="color:#a78bfa">${sk.thisMonth}</div><div class="psl">Este mês</div></div><div class="psk"><div class="psi">📊</div><div class="psv" style="color:#22d3ee">${tot}</div><div class="psl">Total ${selYear}</div></div></div></div>`;
  h+=`<div class="psec"><div class="pst">📋 Resumo Semanal</div><div class="pw"><div class="pwh"><span style="font-size:13px;color:#94a3b8">Semana atual</span><span style="font-size:13px;font-weight:700">${wk.cnt}/7</span></div><div class="pwg">`;
  ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach((d,i)=>{const done=wk.tr[i],isT=wk.days[i]===new Date().toISOString().slice(0,10),isF=wk.days[i]>new Date().toISOString().slice(0,10);h+=`<div class="pwd"><div class="pwdl">${d}</div><div class="pwdd" style="background:${done?"rgba(124,58,237,0.2)":isF?"transparent":"rgba(255,255,255,0.03)"};border:${isT?"2px solid #a78bfa":"1px solid rgba(255,255,255,0.06)"}">${done?"✅":isF?"":"—"}</div></div>`});
  h+=`</div><div class="pwm">${wk.msg}</div><div style="margin-top:10px"><div class="pr"><span>Meta semanal (~${wk.tgt})</span><span>${wk.cnt}/${wk.tgt}</span></div><div class="bbg"><div class="bf" style="width:${Math.min(100,Math.round((wk.cnt/wk.tgt)*100))}%;background:${wk.cnt>=wk.tgt?"linear-gradient(90deg,#22c55e,#4ade80)":"linear-gradient(90deg,#7c3aed,#a78bfa)"}"></div></div></div></div></div>`;
  const unl=badges.filter(b=>b.ok).length;
  h+=`<div class="psec"><div class="pst">🏅 Conquistas</div><div style="font-size:13px;color:#94a3b8;margin-bottom:12px">${unl}/${badges.length} desbloqueadas</div><div class="bg">`;
  badges.forEach(b=>{h+=`<div class="badge ${b.ok?"u":"l"}"><div class="bgi">${b.i}</div><div class="bgn">${b.n}</div><div class="bgd">${b.d}</div>${b.ok?`<div style="font-size:10px;color:#4ade80;margin-top:6px">✓ Desbloqueada!</div>`:`<div class="bgp"><div class="bgpf" style="width:${b.pct}%"></div></div><div style="font-size:10px;color:#64748b;margin-top:4px">${b.pct}%</div>`}</div>`});
  h+=`</div></div>`;
  h+=`<div class="psec"><div class="pst">📊 Comparativo Ano vs Ano</div><div style="margin-bottom:14px"><select style="padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:14px;outline:none;width:100%" onchange="loadCompYear(parseInt(this.value)||null)"><option value="">Selecione um ano</option>`;
  for(let y=MNY;y<=MXY;y++){if(y!==selYear)h+=`<option value="${y}" ${y===compYear?"selected":""}>${y}</option>`}
  h+=`</select></div>`;
  if(compYear){const cu=new Set(compData.map(e=>e.date));h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px"><div class="card"><div class="cl">${selYear}</div><div class="cv" style="color:#a78bfa">${tot}</div><div class="cs">dias</div></div><div class="card"><div class="cl">${compYear}</div><div class="cv" style="color:#22d3ee">${cu.size}</div><div class="cs">dias</div></div></div>`;
  for(let m=0;m<12;m++){const di=dim(selYear,m),curM=mdd(m),cp=`${compYear}-${String(m+1).padStart(2,"0")}`,compM=new Set(compData.filter(e=>e.date.startsWith(cp)).map(e=>e.date)).size;h+=`<div class="cr"><span class="crl">${MN[m].slice(0,3)}</span><div class="crb"><div class="crbr"><span class="crby">${selYear}</span><div class="crbb"><div class="crbf" style="width:${(curM/di)*100}%;background:#a78bfa"></div></div><span class="crbv" style="color:#a78bfa">${curM}</span></div><div class="crbr"><span class="crby">${compYear}</span><div class="crbb"><div class="crbf" style="width:${(compM/dim(compYear,m))*100}%;background:#22d3ee"></div></div><span class="crbv" style="color:#22d3ee">${compM}</span></div></div></div>`}}
  h+=`</div>`;return h
}

// Main render
function render(){
  const R=document.getElementById("root");
  if(!user){R.innerHTML=`<div class="auth-box"><h1>TREINO TRACKER</h1><p>Acompanhe seus treinos, ano a ano</p><button class="btn-g" onclick="loginG()">${GSVG} Entrar com Google</button></div>`;return}
  const now=new Date(),dy=doy(),td=diy(selYear),tot=ud(),exp=Math.round((goal/td)*dy),diff=tot-exp;
  const apx=dy>0?Math.round((tot/dy)*100):0,name=user.user_metadata?.full_name||user.email;
  const cy=isCY(),yd=selYear<now.getFullYear();
  let h=`<div class="topbar"><span class="topbar-user">${name}</span><button class="btn-sm" onclick="logOut()">Sair</button></div>`;
  h+=`<div class="ynav"><button onclick="chgY(-1)" ${selYear<=MNY?"disabled":""}>‹</button><span class="ylbl">${selYear}</span><button onclick="chgY(1)" ${selYear>=MXY?"disabled":""}>›</button></div>`;
  if(!cy)h+=`<div class="ycur" onclick="goCY()">← Voltar para ${now.getFullYear()}</div>`;
  h+=`<div class="gw"><span>Meta:</span><input type="number" min="1" max="366" value="${goal}" onchange="setGoal(this.value)"/><span>de ${td} dias</span></div>`;
  const rl=yd?(diff>=0?"meta batida":"meta não batida"):(diff>=0?"adiantado":"atrasado");
  h+=`<div class="cards">${[{l:"Dias treinados",v:tot,s:`de ${goal}`,c:"#a78bfa"},{l:yd?"Dias no ano":"Dias restantes",v:yd?td:Math.max(0,td-dy),s:yd?"total":"do ano",c:"#38bdf8"},{l:"Ritmo",v:(diff>=0?"+":"")+diff,s:rl,c:diff>=0?"#4ade80":"#f87171"},{l:"Aproveitamento",v:(yd?Math.round((tot/td)*100):apx)+"%",s:yd?"do ano":"até agora",c:"#facc15"}].map(c=>`<div class="card"><div class="cl">${c.l}</div><div class="cv" style="color:${c.c}">${c.v}</div><div class="cs">${c.s}</div></div>`).join("")}</div>`;
  const p1=Math.min(100,Math.round((tot/goal)*100)),p2=Math.min(100,Math.round((dy/td)*100));
  h+=`<div class="pbox"><div class="pr"><span>Progresso da Meta</span><span>${tot}/${goal}</span></div><div class="bbg"><div class="bf" style="width:${p1}%;background:linear-gradient(90deg,#7c3aed,#a78bfa)"></div></div><div class="pr"><span>Progresso do Ano</span><span>${dy}/${td}</span></div><div class="bbg"><div class="bf" style="width:${p2}%;background:linear-gradient(90deg,#1e40af,#38bdf8)"></div></div></div>`;
  h+=`<div class="nav"><button class="${view==="calendar"?"on":"off"}" onclick="view='calendar';render()">Calendário</button><button class="${view==="stats"?"on":"off"}" onclick="view='stats';render()">Mensal</button><button class="${view==="types"?"on":"off"}" onclick="view='types';render()">Por Tipo</button><button class="${view==="workout"?"on":"off"}" onclick="view='workout';wlView='plans';render()">🏋️ Musculação</button><button class="${view==="performance"?"on":"off"}" onclick="view='performance';render()">🏅 Desempenho</button></div>`;

  if(view==="calendar"){
    const ut=new Set(ye().map(e=>e.type));if(ut.size){h+=`<div class="lg">`;for(const t of ut){const ty=TYPES[t];if(ty)h+=`<div class="li"><div class="ld" style="background:${ty.color}"></div>${ty.name}</div>`}h+=`</div>`}
    h+=`<div class="mgrid">`;for(let m=0;m<12;m++){const di=dim(selYear,m),f=fdw(selYear,m),tr=mdd(m),pct=Math.round((tr/di)*100),cm=cy&&now.getMonth()===m,tdx=now.getDate();h+=`<div class="mb"><div class="mh"><span class="mn">${MN[m]}</span><span class="mbdg" style="background:${pbg(pct)};color:${pcl(pct)}">${tr}/${di} · ${pct}%</span></div><div class="dwh">${DWK.map(d=>`<span>${d}</span>`).join("")}</div><div class="dg">`;for(let i=0;i<f;i++)h+=`<div class="dc"><div class="dn e"></div></div>`;for(let d=1;d<=di;d++){const date=ds(selYear,m,d),types=dty(date),has=types.length>0,isT=cm&&d===tdx;h+=`<div class="dc" onclick="openMod(${m},${d})"><div class="dn ${has?"t":"o"} ${isT?"td":""}">${d}</div>`;if(has){h+=`<div class="dts">`;for(const t of types.slice(0,4)){const ty=TYPES[t];if(ty)h+=`<div class="dt" style="background:${ty.color}"></div>`}h+=`</div>`}h+=`</div>`}h+=`</div></div>`}h+=`</div>`;
  }else if(view==="stats"){
    h+=`<div class="sl">`;for(let m=0;m<12;m++){const di=dim(selYear,m),tr=mdd(m),pct=Math.round((tr/di)*100),cur=cy&&now.getMonth()===m;h+=`<div class="sr ${cur?"cu":""}"><span class="sn">${MN[m]}</span><div class="sbb"><div class="sbf" style="width:${pct}%;background:${bgr(pct)}"></div></div><span class="sp ${pcc(pct)}">${pct}%</span><span class="sc">${tr}/${di}</span></div>`}h+=`</div>`;
  }else if(view==="types"){
    const yex=ye(),cts={};yex.forEach(e=>{cts[e.type]=(cts[e.type]||0)+1});const srt=Object.entries(cts).sort((a,b)=>b[1]-a[1]);
    h+=`<div class="tst">`;for(const[k,c]of srt){const t=TYPES[k];if(!t)continue;h+=`<div class="tc"><div class="tci">${t.icon}</div><div class="tcinf"><div class="tcn">${t.name}</div><div class="tcv" style="color:${t.color}">${c}</div></div></div>`}if(!srt.length)h+=`<div style="text-align:center;color:#64748b;grid-column:1/-1;padding:40px">Nenhum treino em ${selYear}</div>`;h+=`</div>`;
    if(srt.length){h+=`<div>`;for(const[k,c]of srt){const t=TYPES[k];if(!t)continue;const pct=tot>0?Math.min(100,Math.round((c/tot)*100)):0;h+=`<div class="sr" style="margin-bottom:8px"><span style="font-size:18px;width:30px;text-align:center">${t.icon}</span><span class="sn">${t.name}</span><div class="sbb"><div class="sbf" style="width:${pct}%;background:${t.color}"></div></div><span class="sp" style="color:${t.color}">${c}x</span></div>`}h+=`</div>`}
  }else if(view==="workout"){h+=rWorkout()}
  else if(view==="performance"){h+=rPerf()}
  h+=`<p class="ft">Toque no dia para registrar · Sincronizado na nuvem</p>`;
  h+=rModal();R.innerHTML=h;
}

(async()=>{const{data:{session}}=await sb.auth.getSession();if(session){user=session.user;await loadData()}else render();sb.auth.onAuthStateChange(async(ev,s)=>{if(ev==="SIGNED_IN"&&s){user=s.user;await loadData()}else if(ev==="SIGNED_OUT"){user=null;entries=[];allDates=[];goal=350;render()}})})();
</script>
</body>
</html>
